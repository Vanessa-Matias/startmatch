<!--
  Tela: Dashboard da Startup
  ===========================
  Tela principal de quem está logado como Startup. Três blocos de conteúdo,
  carregados via API pelo main.ts:
    - #resumo-perfil          -> dados do próprio perfil (nome, estágio, plano)
    - #sugestoes              -> investidores compatíveis, sugeridos por algoritmo
    - #interesses-recebidos   -> investidores que demonstraram interesse na startup

  O bloco "Mentoria" (#mentoria-stub) é só uma prévia estática — a funcionalidade de
  mentoria paga ainda não foi implementada nesta 1ª entrega (fica para depois).

  IDENTIDADE VISUAL (atualização): só o ícone do card "Mentoria" e o espaçamento
  mudaram aqui — a navbar escura, os cards com hover e o badge de pontuação já
  vêm automaticamente de components.css/variables.css. Nenhum id usado pelo
  main.ts foi alterado.
-->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StartMatch — Dashboard</title>
    <!-- Manifest + cor de tema do PWA — repetido no <head> de toda tela -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f2148" />
    <link rel="stylesheet" href="../../styles/variables.css" />
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container">
        <a href="../home/index.html">StartMatch</a>
        <!-- Preenchido dinamicamente por main.ts via scripts/nav.ts (renderNav) -->
        <nav id="nav-links"></nav>
      </div>
    </header>

    <div class="container">
      <span class="section-eyebrow blue">SEU PAINEL</span>
      <h1 style="font-size: 1.7rem; margin-bottom: var(--spacing-md)">Dashboard</h1>

      <section id="resumo-perfil" class="card card-feature">
        <p class="text-muted">Carregando perfil…</p>
      </section>

      <div class="spacer-lg"></div>
      <!-- Bloco estático (não tem lógica em main.ts) — só um aviso do que vem depois -->
      <div class="card card-feature" id="mentoria-stub">
        <div class="icon-circle" style="background: #fef2f2">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 018 0v3"></path></svg>
        </div>
        <div class="card-title">Mentoria</div>
        <p class="text-muted">Disponível no plano Premium — em breve.</p>
      </div>

      <div class="spacer-xl"></div>
      <span class="section-eyebrow green">SUGESTÕES</span>
      <h2>Investidores sugeridos para você</h2>
      <div class="spacer-sm"></div>
      <div id="sugestoes" class="grid">
        <p class="text-muted">Carregando sugestões…</p>
      </div>

      <div class="spacer-xl"></div>
      <h2>Interesses recebidos</h2>
      <div class="spacer-sm"></div>
      <div id="interesses-recebidos" class="stack">
        <p class="text-muted">Carregando interesses…</p>
      </div>
      <div class="spacer-xl"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
