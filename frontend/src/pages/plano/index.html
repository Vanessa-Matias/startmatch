<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>StartMatch — Plano</title>

    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#152a54" />

    <link rel="stylesheet" href="../../styles/variables.css" />

    <link rel="stylesheet" href="../../styles/global.css" />

    <link rel="stylesheet" href="../../styles/components.css" />

    <style>
      .plan-card {
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          border-color 0.15s ease;
      }

      .plan-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(15, 33, 72, 0.08);
      }

      .plan-card.plan-selected {
        border-color: var(--color-primary);

        box-shadow: 0 0 0 2px rgba(47, 111, 235, 0.12);
      }

      .plan-card.plan-current {
        border-color: var(--color-primary);
      }

      .plan-actions {
        margin-top: var(--spacing-md);
      }

      /* estilos da área de pagamento: components.css (.payment-*) */
    </style>
  </head>

  <body>
    <header class="navbar">
      <div class="container">
        <a href="../home/index.html"> StartMatch </a>

        <nav id="nav-links"></nav>
      </div>
    </header>

    <div class="container">
      <h1>Plano e assinatura</h1>

      <div class="card">
        <div class="card-title">Plano atual</div>

        <p>
          Você está no plano
          <span class="badge" id="plano-atual"> — </span>.
        </p>
      </div>

      <div class="spacer-lg"></div>

      <h2>Planos disponíveis</h2>

      <p class="text-muted">
        Escolha o plano que melhor atende às suas necessidades.
      </p>

      <div id="planos-comparacao" class="stack">
        <p class="text-muted">Carregando planos…</p>
      </div>

      <!-- Área de pagamento (cartão/PIX), criada por scripts/payment.ts -->
      <div id="pagamento-area"></div>

      <div class="spacer-lg"></div>

      <p class="form-error" id="form-error"></p>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
