<!--
  Tela: Mentorias (Startup)
  ============================
  Nova tela do fluxo — item "Mentorias" do menu da Startup na hierarquia do
  fluxograma da designer: "área para solicitar sessões com mentores conforme o
  plano contratado". Lista os mentores cadastrados na plataforma (GET /mentors,
  endpoint novo) para a startup escolher com quem quer mentoria.

  O agendamento de sessão em si (Etapa 6 do fluxograma: Startup -> Agendamento ->
  Mentor) ainda não tem backend nesta 1ª entrega ("mentoria funcionando ponta a
  ponta" está fora do escopo desta entrega) — por isso o botão "Solicitar
  mentoria" funciona só como demonstração: sempre avisa que a startup não tem
  mais mentorias disponíveis (ver main.ts).
-->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StartMatch — Mentorias</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#152a54" />
    <link rel="stylesheet" href="../../styles/variables.css" />
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
    <style>
      /* Cards dos perfis de mentor (main.ts) */
      .mentor-card {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-sm);
      }
      .mentor-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .mentor-foto {
        flex-shrink: 0;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
        object-position: center top;
        border: 2px solid #ffffff;
        box-shadow: 0 0 0 2px rgba(47, 111, 235, 0.35);
      }
      /* sem foto: círculo com as iniciais */
      .mentor-iniciais {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2f6feb, #16a34a);
        color: #fff;
        font-family: var(--font-family-display);
        font-weight: 700;
      }
      .mentor-perfil-foto.mentor-iniciais {
        font-size: 2rem;
      }
      .mentor-nome {
        margin: 0;
      }
      .mentor-area {
        margin: 2px 0 0;
        font-size: 0.9rem;
      }
      .mentor-card .badge-eyebrow {
        align-self: flex-start;
      }
      .mentor-bio {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.55;
      }
      .mentor-tags {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .mentor-info {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.88rem;
        color: var(--color-text-muted);
      }
      .mentor-info strong {
        color: var(--color-text);
      }
      .mentor-acoes {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: var(--spacing-sm);
      }

      /* modal do perfil */
      .modal-backdrop[hidden] {
        display: none;
      }
      .modal {
        max-height: calc(100vh - 48px);
        overflow-y: auto;
      }
      .mentor-modal-close {
        position: absolute;
        top: 12px;
        right: 12px;
      }
      .mentor-perfil {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
        margin-bottom: var(--spacing-md);
      }
      .mentor-perfil-foto {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        object-fit: cover;
        object-position: center top;
        box-shadow: 0 0 0 3px rgba(47, 111, 235, 0.3);
        margin-bottom: 6px;
      }
      .mentor-perfil h2 {
        margin: 0;
        font-size: 1.35rem;
      }
      .mentor-perfil-cargo {
        margin: 0 0 4px;
        color: var(--color-text-muted);
      }
      .modal .mentor-info {
        margin-bottom: var(--spacing-md);
      }
      .modal .mentor-bio {
        margin-bottom: var(--spacing-sm);
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <div class="container">
        <a href="../home/index.html">StartMatch</a>
        <nav id="nav-links"></nav>
      </div>
    </header>

    <div class="container">
      <h1>Mentorias</h1>
      <p class="text-muted">
        Escolha um mentor credenciado para solicitar uma sessão.
      </p>

      <div id="mentores-list" class="grid">
        <p class="text-muted">Carregando mentores…</p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
