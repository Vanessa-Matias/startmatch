<!--
  Tela: Perfil (detalhe de startup ou investidor)
  ==================================================
  Tela "genérica" de detalhe — não tem um tipo fixo, ela lê pela URL quem deve
  mostrar: ?tipo=startup&id=5 ou ?tipo=investidor&id=12 (esses links vêm dos cards
  de busca, sugestões e matches em outras telas).

  #perfil-detalhe é preenchido com os dados vindos da API. O botão "Tenho interesse"
  é a ação principal desta tela — clicar nele registra o interesse no backend.
-->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StartMatch — Perfil</title>
    <!-- Manifest + cor de tema do PWA — repetido no <head> de toda tela -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#152a54" />
    <link rel="stylesheet" href="../../styles/variables.css" />
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container">
        <a href="../home/index.html">StartMatch</a>
        <!-- Preenchido dinamicamente por main.ts via scripts/nav.ts (renderNav) -->
        <nav id="nav-links"></nav>
      </div>
    </header>

    <div class="container container--narrow">
      <div id="perfil-detalhe" class="card">
        <p class="text-muted">Carregando perfil…</p>
      </div>

      <div class="spacer-md"></div>
      <button class="btn btn-accent btn-block" id="btn-interesse" type="button">
        Tenho interesse
      </button>
      <p class="form-error" id="form-error"></p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
